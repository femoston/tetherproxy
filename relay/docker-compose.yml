services:
  relay:
    build: .
    image: tetherproxy-relay:latest
    container_name: tetherproxy-relay
    restart: unless-stopped
    env_file: .env
    expose:
      - "31742"
      - "48193"
      # - "8081:8081" # optional TLS proxy (uncomment with PROXY_TLS_PORT)
    volumes:
      - relay-data:/data
      - relay-certs:/certs

volumes:
  relay-data:
  relay-certs:
