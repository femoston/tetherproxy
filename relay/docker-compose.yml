services:
  relay:
    build: .
    image: tetherproxy-relay:latest
    container_name: tetherproxy-relay
    restart: unless-stopped
    env_file: .env
    ports:
      - "31742:31742"
      - "48193:48193"
    volumes:
      - relay-data:/data
      - relay-certs:/certs

volumes:
  relay-data:
  relay-certs:
